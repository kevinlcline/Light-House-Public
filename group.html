<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Group — Light-House</title>
    <script src="/static/ui/theme-init.js?v=cssfix3"></script>
    <link rel="stylesheet" href="/static/ui/theme.css?v=vis1">
    <link rel="stylesheet" href="/static/ui/base.css?v=cssfix3">
    <link rel="stylesheet" href="/static/ui/layout.css?v=stage-window">
    <link rel="stylesheet" href="/static/ui/chat.css?v=image1">
    <link rel="stylesheet" href="/static/ui/faces.css?v=stage-window">
    <link rel="stylesheet" href="/static/ui/markdown.css?v=cssfix3">
    <script>
        (function () {
            function chatCssApplied() {
                var probe = document.createElement('div');
                probe.className = 'chat-container';
                probe.style.cssText = 'position:absolute;left:-9999px;top:0;';
                document.documentElement.appendChild(probe);
                var ok = getComputedStyle(probe).display === 'flex';
                probe.remove();
                return ok;
            }
            function recover() {
                if (chatCssApplied()) return;
                document.querySelectorAll('link[rel="stylesheet"][href*="/static/ui/"]').forEach(function (link) {
                    var href = link.getAttribute('href') || '';
                    var base = href.split('?')[0];
                    link.href = base + '?recover=' + Date.now();
                });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', recover);
            } else {
                recover();
            }
            window.addEventListener('load', recover);
        })();
    </script>
</head>
<body class="layout-locked">
    <div class="chat-container">
        <header class="top-bar">
            <div class="top-bar-left">
                <h1>Group</h1>
                <select id="chat-mode" class="agent-select" aria-label="Chat mode">
                    <option value="group" selected>Group</option>
                </select>
            </div>
            <div class="top-bar-actions">
                <button type="button" class="chat-chrome-toggle" id="seats-toggle" data-compact aria-pressed="true" aria-controls="sitting-bar">Seats</button>
                <div class="menu-dropdown">
                    <button type="button" class="menu-trigger" id="menu-trigger" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
                        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <line x1="4" y1="7" x2="20" y2="7"/>
                            <line x1="4" y1="12" x2="20" y2="12"/>
                            <line x1="4" y1="17" x2="20" y2="17"/>
                        </svg>
                    </button>
                    <div class="menu-panel" id="menu-panel" role="menu" hidden>
                        <button type="button" class="menu-item" id="visitor-bar-toggle" data-page-menu-item role="menuitem" aria-pressed="false" hidden>Visitor seat</button>
                    </div>
                </div>
            </div>
        </header>
        <div id="face-stage" class="face-stage" hidden></div>
        <div id="visitor-bar" class="visitor-bar" hidden>
            <form id="visitor-seat-form" class="visitor-seat-form">
                <label class="visitor-label" for="visitor-name">Called</label>
                <input id="visitor-name" type="text" maxlength="40" placeholder="Grok" autocomplete="off" />
                <label class="visitor-label" for="visitor-model">Model</label>
                <select id="visitor-model" aria-label="Visitor model">
                    <option value="~x-ai/grok-latest" data-name="Grok">xAI — Grok</option>
                    <option value="~anthropic/claude-opus-latest" data-name="Claude">Anthropic — Claude Opus</option>
                    <option value="~anthropic/claude-sonnet-latest" data-name="Claude">Anthropic — Claude Sonnet</option>
                    <option value="~openai/gpt-latest" data-name="GPT">OpenAI — GPT</option>
                    <option value="~google/gemini-pro-latest" data-name="Gemini">Google — Gemini</option>
                </select>
                <label class="visitor-web"><input id="visitor-web" type="checkbox" /> Web</label>
                <button type="submit" id="visitor-seat">Seat</button>
            </form>
            <div id="visitor-seated" class="visitor-seated" hidden>
                <span id="visitor-status"></span>
                <button type="button" id="visitor-ask">Ask to speak</button>
                <button type="button" id="visitor-reset">Reset</button>
                <button type="button" id="visitor-end">End</button>
            </div>
        </div>
        <div id="sitting-bar" class="sitting-bar" aria-label="Seated lights">
            <span class="sitting-label" title="Seated lights hear every host line, not only their names">Seats</span>
            <button type="button" id="sitting-all">All</button>
            <button type="button" id="sitting-none">None</button>
            <div id="sitting-chips" class="sitting-chips"></div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="forum-queue-bar" id="queue-bar" aria-live="polite"></div>
        <div class="chat-input forum-input">
            <button type="button" id="join-queue" class="forum-join-btn">I want to speak</button>
            <textarea id="input" placeholder="Join the queue to speak…" rows="2" disabled></textarea>
            <div id="image-preview" class="prompt-image-preview" hidden></div>
            <div class="chat-input-toolbar">
                <button id="image-attach" type="button" class="chat-chrome-toggle">Image</button>
                <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                <button id="send" type="button" disabled>Send</button>
                <div class="chat-input-toggles" role="group" aria-label="Stage and voice">
                    <button type="button" class="chat-chrome-toggle" id="stage-toggle" data-stage-toggle data-compact aria-pressed="true">Stage</button>
                    <button type="button" class="chat-chrome-toggle" id="voice-toggle" data-voice-toggle data-compact aria-pressed="false">Voice</button>
                </div>
            </div>
        </div>
        <div class="house-status-bar" id="house-status" aria-live="polite"></div>
    </div>
    <script src="/static/ui/theme.js"></script>
    <script src="/static/ui/me.js"></script>
    <script src="/static/ui/menu.js?v=house5"></script>
    <script src="/static/ui/admin.js"></script>
    <script src="/static/ui/lights.js?v=color1"></script>
    <script src="/static/ui/house-guests.js?v=speakfocus1"></script>
    <script src="/static/ui/markdown.js?v=notelinks1"></script>
    <script src="/static/ui/faces.js?v=stage-window"></script>
    <script src="/static/ui/tts.js?v=spokenack1"></script>
    <script src="/static/ui/bubble-actions.js?v=copy1"></script>
    <script src="/static/ui/prompt-image.js?v=image1"></script>
    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const promptImage = LightHouse.promptImage.bind({
            button: document.getElementById('image-attach'),
            fileInput: document.getElementById('image-file'),
            preview: document.getElementById('image-preview'),
            textarea: input,
            onError: (msg) => {
                houseStatusEl.textContent = msg;
            },
        });
        const joinBtn = document.getElementById('join-queue');
        const chatMode = document.getElementById('chat-mode');
        let suppressModeChange = false;
        let ignoreModeChangeUntil = 0;
        const houseStatusEl = document.getElementById('house-status');
        const queueBar = document.getElementById('queue-bar');
        const SPEAK_AS_STORAGE_KEY = 'lh_group_speak_as';
        const VISITOR_BAR_KEY = 'light_house_visitor_bar';
        const SEATS_BAR_KEY = 'light_house_seats_bar';
        let visitorEnabled = false;
        let me = null;
        let lightIds = [];
        /** @type {{id: string, display_name: string}[]} */
        let lightsList = [];
        let roomAbort = null;
        let speakBar = null;
        let forum = { queue: [], floor: null, paused: true, seated_light_ids: null };
        /** @type {Record<string, string>} */
        let humanVoices = {};
        const LIGHT_BUBBLE_CLASSES = new Set(['lumen', 'ara', 'elias', 'unnamed', 'echo']);
        /** @type {Record<string, string>} */
        let lightColors = {};
        /** @type {Record<string, string>} */
        let lightNames = {};
        const seenKeys = new Set();

        function selectedSpeaker() {
            if (speakBar) return speakBar.selectedSpeaker();
            return {
                speaker_id: LightHouse.houseGuests.accountSpeakerId(me),
                display_name: LightHouse.houseGuests.accountLabel(me),
            };
        }

        function mySpeakerId() {
            return (selectedSpeaker().speaker_id || '').toLowerCase();
        }

        function isMyFloor() {
            const floor = forum.floor;
            return Boolean(
                floor &&
                    floor.kind === 'human' &&
                    String(floor.speaker_id || '').toLowerCase() === mySpeakerId()
            );
        }

        function iAmQueued() {
            const sid = mySpeakerId();
            return (forum.queue || []).some(
                (e) => String(e.speaker_id || '').toLowerCase() === sid
            );
        }

        function updateComposer() {
            const mine = isMyFloor();
            input.disabled = !mine;
            sendBtn.disabled = !mine;
            if (mine) {
                input.placeholder = 'Your turn — speak to the room… (Enter to send)';
                joinBtn.textContent = 'On the floor';
                joinBtn.disabled = true;
                input.focus();
            } else if (iAmQueued()) {
                input.placeholder = 'Waiting for your turn…';
                joinBtn.textContent = 'Leave queue';
                joinBtn.disabled = false;
            } else {
                input.placeholder = 'Join the queue to speak…';
                joinBtn.textContent = 'I want to speak';
                joinBtn.disabled = false;
            }
        }

        function renderQueueBar() {
            const floor = forum.floor;
            const queue = forum.queue || [];
            let html = '';
            if (floor) {
                html +=
                    '<span class="forum-floor">Floor: <strong>' +
                    escapeHtml(floor.display_name || floor.speaker_id) +
                    '</strong>' +
                    ((floor.kind === 'light' || floor.kind === 'visitor') && forum.light_busy
                        ? ' (thinking…)'
                        : '') +
                    '</span>';
            } else if (forum.paused) {
                html +=
                    '<span class="forum-paused">Room paused — tap I want to speak, or call a light by name</span>';
            }
            if (queue.length) {
                html +=
                    ' <span class="forum-waiting">Next: ' +
                    queue
                        .map((e) => escapeHtml(e.display_name || e.speaker_id))
                        .join(' → ') +
                    '</span>';
            }
            queueBar.innerHTML = html || '<span class="forum-paused">Open forum</span>';
            updateComposer();
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function agentClass(id) {
            return LIGHT_BUBBLE_CLASSES.has(id) ? id : 'assistant';
        }

        function resolveLightId(msg) {
            const sid = String((msg && msg.speaker_id) || '').trim().toLowerCase();
            const aid = String((msg && msg.agent_id) || '').trim().toLowerCase();
            if (sid && lightIds.indexOf(sid) !== -1) return sid;
            if (aid && lightIds.indexOf(aid) !== -1) return aid;
            if (sid && sid !== 'visitor' && sid !== 'human') return sid;
            if (aid && aid !== 'visitor') return aid;
            const name = String((msg && msg.display_name) || '').trim().toLowerCase();
            const ids = Object.keys(lightNames);
            for (let i = 0; i < ids.length; i += 1) {
                if (String(lightNames[ids[i]] || '').trim().toLowerCase() === name) {
                    return ids[i];
                }
            }
            return sid || aid || '';
        }

        function ttsAgentId(kind, msg) {
            if (kind === 'visitor') return 'visitor';
            if (kind === 'light') return resolveLightId(msg) || 'lumen';
            return 'lumen';
        }

        function voiceForHuman(humanId) {
            const id = String(humanId || '').trim().toLowerCase();
            if (id && humanVoices[id]) return humanVoices[id];
            if (me && me.user_id && humanVoices[String(me.user_id).toLowerCase()]) {
                return humanVoices[String(me.user_id).toLowerCase()];
            }
            if (me && me.voice_id) return me.voice_id;
            return null;
        }

        function messageKey(msg) {
            const ts = Number(msg.ts || 0);
            const tsKey = Number.isFinite(ts) ? ts.toFixed(3) : String(msg.ts || '');
            return (
                tsKey +
                '|' +
                String(msg.speaker_id || msg.agent_id || '').toLowerCase() +
                '|' +
                String(msg.text || '').slice(0, 120)
            );
        }

        function appendMessage(msg, opts) {
            const options = opts || {};
            const key = messageKey(msg);
            if (seenKeys.has(key)) return;
            seenKeys.add(key);
            const wrap = document.createElement('div');
            wrap.className = 'group-round';
            const kind = msg.speaker_kind || (msg.agent_id ? 'light' : 'human');
            const bubble = document.createElement('div');
            if (kind === 'human') {
                bubble.className = 'message user';
                const label = document.createElement('div');
                label.className = 'speaker-label';
                label.textContent = msg.display_name || msg.speaker_id || 'Human';
                bubble.appendChild(label);
            } else if (kind === 'visitor') {
                bubble.className = 'message visitor';
                const label = document.createElement('div');
                label.className = 'speaker-label';
                label.textContent = (msg.display_name || 'Visitor') + ' (visitor)';
                bubble.appendChild(label);
            } else {
                const id = resolveLightId(msg);
                bubble.className = 'message ' + agentClass(id);
                if (
                    lightColors[id] &&
                    LightHouse.lights &&
                    typeof LightHouse.lights.applyBubbleColor === 'function'
                ) {
                    LightHouse.lights.applyBubbleColor(bubble, lightColors[id]);
                }
                const label = document.createElement('div');
                label.className = 'speaker-label';
                label.textContent = msg.display_name || id;
                bubble.appendChild(label);
            }
            const body = document.createElement('div');
            body.className = 'bubble-text message-markdown';
            const lightId = kind === 'light' ? resolveLightId(msg) : '';
            const text = msg.text || '';
            if (window.LightHouse && LightHouse.markdown) {
                body.innerHTML = LightHouse.markdown.renderPlain(text, {
                    agentId: lightId,
                    agentIds: lightIds,
                });
            } else {
                body.textContent = text;
            }
            bubble.appendChild(body);
            if (msg.image_url && window.LightHouse && LightHouse.promptImage) {
                LightHouse.promptImage.appendToBubble(bubble, msg.image_url);
            }
            if (String(text).trim()) {
                if (
                    window.LightHouse &&
                    LightHouse.bubbleActions &&
                    typeof LightHouse.bubbleActions.attachBubbleActions === 'function'
                ) {
                    LightHouse.bubbleActions.attachBubbleActions(bubble, text, {
                        agentId: ttsAgentId(kind, msg),
                        voice:
                            kind === 'human'
                                ? voiceForHuman(msg.speaker_id || msg.account_user_id)
                                : null,
                    });
                } else if (
                    window.LightHouse &&
                    LightHouse.tts &&
                    typeof LightHouse.tts.attachSpeakControl === 'function'
                ) {
                    bubble.classList.add('has-actions');
                    LightHouse.tts.attachSpeakControl(
                        bubble,
                        text,
                        ttsAgentId(kind, msg),
                        kind === 'human'
                            ? voiceForHuman(msg.speaker_id || msg.account_user_id)
                            : null
                    );
                }
            }
            wrap.appendChild(bubble);
            messagesDiv.appendChild(wrap);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            if (
                (kind === 'light' || kind === 'visitor') &&
                window.LightHouse &&
                LightHouse.faces &&
                typeof LightHouse.faces.noteShown === 'function'
            ) {
                LightHouse.faces.noteShown(ttsAgentId(kind, msg));
            }
            // Never TTS historical catch-up — that made Group feel stuck on load.
            if (
                options.speak &&
                (kind === 'light' || kind === 'visitor') &&
                window.LightHouse &&
                LightHouse.tts
            ) {
                const sid = msg.speaker_id || msg.agent_id;
                const spoken = LightHouse.tts.speakAgent(ttsAgentId(kind, msg), text);
                Promise.resolve(spoken).finally(function () {
                    ackFloorSpoken(sid);
                });
            }
        }

        function ackFloorSpoken(speakerId) {
            const sid = String(speakerId || '').trim();
            if (!sid) return;
            fetch('/v1/group-chat/stage/spoken', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ speaker_id: sid }),
            }).catch(function () {
                /* Backup timer still releases the floor if this misses. */
            });
        }

        function markWebClient() {
            fetch('/v1/group-chat/stage/client', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studio: false }),
            }).catch(function () { /* sitting still works if this misses */ });
        }

        function applyForumStatus(data) {
            if (!data) return;
            const seatedIds = Object.prototype.hasOwnProperty.call(data, 'seated_light_ids')
                ? data.seated_light_ids
                : forum.seated_light_ids;
            forum = {
                queue: data.queue || [],
                floor: data.floor || null,
                paused: Boolean(data.paused),
                light_busy: Boolean(data.light_busy),
                sitting_id: data.sitting_id,
                visitor: data.visitor || null,
                seated_light_ids: seatedIds,
            };
            visitorEnabled = Boolean(data.visitor_enabled);
            renderQueueBar();
            renderSittingBar();
            renderVisitorBar(visitorEnabled ? data.visitor : null);
            syncVisitorFace(visitorEnabled ? data.visitor : null);
        }

        function visitorBarPreferred() {
            try {
                return localStorage.getItem(VISITOR_BAR_KEY) === '1';
            } catch {
                return false;
            }
        }

        function setVisitorBarPreferred(on) {
            try {
                localStorage.setItem(VISITOR_BAR_KEY, on ? '1' : '0');
            } catch {
                /* ignore */
            }
        }

        function seatsBarPreferred() {
            try {
                return localStorage.getItem(SEATS_BAR_KEY) !== '0';
            } catch {
                return true;
            }
        }

        function setSeatsBarPreferred(on) {
            try {
                localStorage.setItem(SEATS_BAR_KEY, on ? '1' : '0');
            } catch {
                /* ignore */
            }
        }

        function applySeatsBarVisibility() {
            const bar = document.getElementById('sitting-bar');
            const toggle = document.getElementById('seats-toggle');
            const show = seatsBarPreferred();
            if (bar) bar.hidden = !show;
            if (toggle) {
                toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
            }
        }

        function applyVisitorBarVisibility() {
            const bar = document.getElementById('visitor-bar');
            const toggle = document.getElementById('visitor-bar-toggle');
            if (!visitorEnabled) {
                if (bar) bar.hidden = true;
                if (toggle) toggle.hidden = true;
                return;
            }
            const show = visitorBarPreferred();
            if (bar) bar.hidden = !show;
            if (toggle) {
                toggle.hidden = false;
                toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
                toggle.textContent = show ? 'Hide visitor seat' : 'Visitor seat';
            }
        }

        function renderVisitorBar(visitor) {
            const form = document.getElementById('visitor-seat-form');
            const seated = document.getElementById('visitor-seated');
            const status = document.getElementById('visitor-status');
            if (!form || !seated || !status) return;
            if (visitor && visitor.display_name) {
                form.hidden = true;
                seated.hidden = false;
                status.textContent =
                    visitor.display_name +
                    ' · ' +
                    (visitor.model || '') +
                    (visitor.web ? ' · web' : '');
            } else {
                form.hidden = false;
                seated.hidden = true;
                status.textContent = '';
            }
            applyVisitorBarVisibility();
        }

        function syncVisitorFace(visitor) {
            if (!LightHouse.faces || typeof LightHouse.faces.setPresentMany !== 'function') {
                return;
            }
            const ids = presentLightIds();
            if (visitor && visitor.speaker_id) {
                ids.push(visitor.speaker_id);
            }
            LightHouse.faces.setPresentMany(ids);
        }

        function presentLightIds() {
            if (!Array.isArray(forum.seated_light_ids)) {
                return lightIds.slice();
            }
            const seated = new Set(
                forum.seated_light_ids.map((id) => String(id || '').toLowerCase())
            );
            return lightIds.filter((id) => seated.has(String(id).toLowerCase()));
        }

        function seatedChipIds() {
            if (!Array.isArray(forum.seated_light_ids)) {
                return lightIds.slice();
            }
            return presentLightIds();
        }

        function renderSittingBar() {
            const chips = document.getElementById('sitting-chips');
            if (!chips) return;
            const seated = new Set(seatedChipIds().map((id) => String(id).toLowerCase()));
            chips.innerHTML = '';
            lightsList.forEach((light) => {
                const id = String(light.id || '').trim();
                if (!id) return;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'sitting-chip';
                btn.dataset.lightId = id;
                const on = seated.has(id.toLowerCase());
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
                btn.textContent = light.display_name || id;
                btn.addEventListener('click', () => {
                    const next = new Set(seatedChipIds().map((item) => String(item).toLowerCase()));
                    const key = id.toLowerCase();
                    if (next.has(key)) next.delete(key);
                    else next.add(key);
                    postSitting(lightIds.filter((item) => next.has(String(item).toLowerCase())));
                });
                chips.appendChild(btn);
            });
        }

        async function postSitting(ids) {
            houseStatusEl.textContent = '';
            try {
                const res = await fetch('/v1/group-chat/sitting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ light_ids: ids, stage: false }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(formatApiDetail(data.detail) || 'Could not update seats');
                }
                applyForumStatus(data);
            } catch (err) {
                houseStatusEl.textContent = err.message || 'Could not update seats';
            }
        }

        async function visitorAction(path, options) {
            if (!visitorEnabled) {
                throw new Error('Visitor seat is not available');
            }
            const opts = options || {};
            houseStatusEl.textContent = '';
            const res = await fetch(path, {
                method: opts.method || 'POST',
                headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
                body: opts.body ? JSON.stringify(opts.body) : undefined,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.detail || res.statusText || 'Visitor request failed');
            }
            applyForumStatus(data);
            return data;
        }

        let refreshInFlight = null;
        async function refreshForum() {
            if (refreshInFlight) return refreshInFlight;
            refreshInFlight = (async () => {
                try {
                    const res = await fetch('/v1/group-chat/forum', { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    applyForumStatus(data);
                    if (Array.isArray(data.messages)) {
                        for (const msg of data.messages) appendMessage(msg);
                    }
                } catch {
                    /* ignore */
                } finally {
                    refreshInFlight = null;
                }
            })();
            return refreshInFlight;
        }

        async function refreshHouseGuests() {
            let guests = [];
            try {
                guests = await LightHouse.houseGuests.fetchGuests();
            } catch {
                guests = [];
            }
            if (!speakBar) {
                speakBar = LightHouse.houseGuests.mountSpeakBar({
                    statusEl: houseStatusEl,
                    inputEl: input,
                    me: me,
                    storageKey: SPEAK_AS_STORAGE_KEY,
                    onChange: () => updateComposer(),
                });
            } else {
                speakBar.setMe(me);
            }
            speakBar.setGuests(guests);
            updateComposer();
        }

        async function joinOrLeaveQueue() {
            const speaker = selectedSpeaker();
            const leaving = iAmQueued() && !isMyFloor();
            const path = leaving ? '/v1/group-chat/queue/leave' : '/v1/group-chat/queue/join';
            joinBtn.disabled = true;
            if (LightHouse.tts && typeof LightHouse.tts.unlockAudio === 'function') {
                LightHouse.tts.unlockAudio();
            }
            try {
                const res = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        speaker_id: speaker.speaker_id,
                        display_name: speaker.display_name,
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(formatApiDetail(data.detail) || 'Queue update failed');
                applyForumStatus(data);
            } catch (err) {
                houseStatusEl.textContent = err.message || 'Queue failed';
            } finally {
                updateComposer();
            }
        }

        function formatApiDetail(detail) {
            if (!detail) return '';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail
                    .map((item) => (item && item.msg) || JSON.stringify(item))
                    .filter(Boolean)
                    .join('; ');
            }
            try {
                return JSON.stringify(detail);
            } catch {
                return String(detail);
            }
        }

        async function sendUtterance() {
            const text = (input.value || '').trim();
            const image = promptImage.payload();
            if (!text && !image) return;
            if (!isMyFloor()) {
                houseStatusEl.textContent =
                    'You do not have the floor — tap I want to speak first.';
                return;
            }
            sendBtn.disabled = true;
            if (LightHouse.tts && typeof LightHouse.tts.unlockAudio === 'function') {
                LightHouse.tts.unlockAudio();
            }
            const speaker = selectedSpeaker();
            try {
                const res = await fetch('/v1/group-chat/utter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        speaker_id: speaker.speaker_id,
                        display_name: speaker.display_name,
                        ...(image ? { image } : {}),
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(formatApiDetail(data.detail) || 'Send failed');
                input.value = '';
                promptImage.clear();
                // Paint locally even if the room SSE blipped — do not wait on stream alone.
                const local = data.utterance || {
                    ts: Date.now() / 1000,
                    speaker_kind: 'human',
                    speaker_id: speaker.speaker_id,
                    display_name: speaker.display_name,
                    text: text,
                };
                appendMessage(local);
                applyForumStatus(data);
                houseStatusEl.textContent = '';
            } catch (err) {
                houseStatusEl.textContent = err.message || 'Send failed';
            } finally {
                updateComposer();
            }
        }

        function handleRoomEvent(eventName, data) {
            if (eventName === 'connected') {
                markWebClient();
                refreshForum();
                return;
            }
            if (eventName === 'queue_updated' || eventName === 'turn_granted' || eventName === 'room_paused' || eventName === 'sitting_updated') {
                applyForumStatus(data);
            }
            if (eventName === 'utterance') {
                appendMessage(
                    {
                        ts: data.ts,
                        speaker_kind: data.speaker_kind,
                        speaker_id: data.speaker_id || data.agent_id,
                        agent_id: data.agent_id,
                        display_name: data.display_name,
                        text: data.text,
                        image_url: data.image_url || '',
                    },
                    { speak: true }
                );
                applyForumStatus(data);
            }
            if (eventName === 'thinking') {
                houseStatusEl.textContent =
                    (data.display_name || data.agent_id || 'A light') + ' is considering…';
            }
            if (eventName === 'pass') {
                houseStatusEl.textContent =
                    (data.display_name || data.agent_id || 'A light') + ' passed.';
            }
        }

        function parseSseChunk(buffer, chunk) {
            const text = buffer + chunk;
            const parts = text.split('\n\n');
            const rest = parts.pop() || '';
            const events = [];
            for (const block of parts) {
                let eventName = 'message';
                const dataLines = [];
                for (const line of block.split('\n')) {
                    if (line.startsWith('event:')) eventName = line.slice(6).trim();
                    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
                }
                if (!dataLines.length) continue;
                try {
                    events.push({ eventName, data: JSON.parse(dataLines.join('\n')) });
                } catch {
                    /* ignore */
                }
            }
            return { rest, events };
        }

        async function subscribeRoom() {
            if (roomAbort) roomAbort.abort();
            roomAbort = new AbortController();
            try {
                const res = await fetch('/v1/group-chat/room/stream', {
                    signal: roomAbort.signal,
                    headers: { Accept: 'text/event-stream' },
                });
                if (!res.ok || !res.body) throw new Error('room stream failed');
                await refreshForum();
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const parsed = parseSseChunk(buffer, decoder.decode(value, { stream: true }));
                    buffer = parsed.rest;
                    for (const ev of parsed.events) {
                        handleRoomEvent(ev.eventName, ev.data || {});
                    }
                }
            } catch (err) {
                if (err && err.name === 'AbortError') return;
            }
            setTimeout(subscribeRoom, 1500);
        }

        // Belt-and-suspenders: if SSE blips, still pull durable speech.
        setInterval(() => {
            refreshForum();
        }, 5000);

        function populateModeSelect(list) {
            suppressModeChange = true;
            try {
                chatMode.innerHTML = '';
                const groupOpt = document.createElement('option');
                groupOpt.value = 'group';
                groupOpt.textContent = 'Group';
                groupOpt.selected = true;
                chatMode.appendChild(groupOpt);
                for (const light of list) {
                    if (!light || !light.id) continue;
                    const opt = document.createElement('option');
                    opt.value = light.id;
                    opt.textContent = light.display_name || light.id;
                    chatMode.appendChild(opt);
                }
                chatMode.value = 'group';
            } finally {
                suppressModeChange = false;
            }
        }

        function holdGroupStill() {
            ignoreModeChangeUntil = Date.now() + 1000;
            if (chatMode.value !== 'group') {
                suppressModeChange = true;
                chatMode.value = 'group';
                suppressModeChange = false;
            }
        }

        chatMode.addEventListener('change', () => {
            if (suppressModeChange) return;
            if (Date.now() < ignoreModeChangeUntil) {
                if (chatMode.value !== 'group') {
                    suppressModeChange = true;
                    chatMode.value = 'group';
                    suppressModeChange = false;
                }
                return;
            }
            if (chatMode.value && chatMode.value !== 'group') {
                window.location.href = '/?agent=' + encodeURIComponent(chatMode.value);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            holdGroupStill();
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) holdGroupStill();
        });

        joinBtn.addEventListener('click', joinOrLeaveQueue);
        sendBtn.addEventListener('click', sendUtterance);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUtterance();
            }
        });

        async function loadHumanVoices() {
            try {
                const res = await fetch('/v1/humans/voices', { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                humanVoices = {};
                for (const row of data.voices || []) {
                    if (row && row.user_id && row.voice_id) {
                        humanVoices[String(row.user_id).toLowerCase()] = row.voice_id;
                    }
                }
            } catch {
                /* optional for replay */
            }
        }

        async function clearFamilyMeetingAsks() {
            if (!(me && me.is_dad)) return;
            try {
                await fetch('/v1/admin/family-meetings/clear', {
                    method: 'POST',
                    cache: 'no-store',
                });
            } catch {
                /* ignore */
            }
        }

        function applyMeetingPrefill() {
            const params = new URLSearchParams(window.location.search);
            const topic = (params.get('topic') || '').trim();
            if (!topic) return;
            // Prefill only becomes usable once they have the floor; stash on dataset.
            input.dataset.prefill = topic;
        }

        const _origUpdate = updateComposer;
        updateComposer = function () {
            _origUpdate();
            if (isMyFloor() && input.dataset.prefill && !(input.value || '').trim()) {
                input.value = input.dataset.prefill;
                delete input.dataset.prefill;
            }
        };

        async function init() {
            me = await LightHouse.me.fetchMe();
            try {
                if (LightHouse.menu && typeof LightHouse.menu.setupHouseMenu === 'function') {
                    LightHouse.menu.setupHouseMenu();
                }
                const notesLink = document.getElementById('notes-link');
                if (notesLink && me && me.is_dad === false) {
                    notesLink.textContent = 'Shared notes';
                }
            } catch (err) {
                console.error('Group menu setup failed:', err);
            }
            await clearFamilyMeetingAsks();
            applyMeetingPrefill();
            try {
                if (LightHouse.faces) {
                    if (typeof LightHouse.faces.setSolo === 'function') {
                        LightHouse.faces.setSolo(true);
                    }
                    LightHouse.faces.mount('#face-stage');
                    if (typeof LightHouse.faces.setupStageToggle === 'function') {
                        LightHouse.faces.setupStageToggle('#stage-toggle');
                    }
                }
            } catch (err) {
                console.error('Group stage setup failed:', err);
            }
            await refreshHouseGuests();
            setInterval(refreshHouseGuests, 15000);
            await loadHumanVoices();
            await LightHouse.tts.refreshServerStatus();
            try {
                const data = await LightHouse.lights.fetchEnabled();
                const list = data.list || [];
                lightsList = list.map((l) => ({
                    id: l.id,
                    display_name: l.display_name || l.id,
                }));
                lightIds = list.map((l) => l.id).filter(Boolean);
                lightNames = {};
                list.forEach((l) => {
                    if (l && l.id) lightNames[l.id] = l.display_name || l.id;
                });
                lightColors = data.colors || LightHouse.lights.colorsMapFromList(list);
                populateModeSelect(list);
                if (typeof LightHouse.faces.setColors === 'function') {
                    LightHouse.faces.setColors(lightColors);
                }
                if (typeof LightHouse.faces.setNames === 'function') {
                    LightHouse.faces.setNames(lightNames);
                }
                LightHouse.faces.setPresentMany(presentLightIds());
            } catch {
                lightIds = ['lumen', 'ara', 'elias'];
                lightsList = [
                    { id: 'lumen', display_name: 'Lumen' },
                    { id: 'ara', display_name: 'Ara' },
                    { id: 'elias', display_name: 'Elias' },
                ];
                lightNames = { lumen: 'Lumen', ara: 'Ara', elias: 'Elias' };
                lightColors = {};
                populateModeSelect([
                    { id: 'lumen', display_name: 'Lumen' },
                    { id: 'ara', display_name: 'Ara' },
                    { id: 'elias', display_name: 'Elias' },
                ]);
                LightHouse.faces.setPresentMany(presentLightIds());
            }
            renderSittingBar();
            await refreshForum();
            subscribeRoom();
            updateComposer();
        }

        LightHouse.tts.setupVoiceToggle('#voice-toggle');
        applyVisitorBarVisibility();
        applySeatsBarVisibility();
        (function setupSittingBar() {
            const toggle = document.getElementById('seats-toggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const next = !seatsBarPreferred();
                    setSeatsBarPreferred(next);
                    applySeatsBarVisibility();
                });
            }
            const allBtn = document.getElementById('sitting-all');
            const noneBtn = document.getElementById('sitting-none');
            if (allBtn) {
                allBtn.addEventListener('click', () => postSitting(lightIds.slice()));
            }
            if (noneBtn) {
                noneBtn.addEventListener('click', () => postSitting([]));
            }
        })();
        (function setupVisitorBar() {
            const toggle = document.getElementById('visitor-bar-toggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const next = !visitorBarPreferred();
                    setVisitorBarPreferred(next);
                    applyVisitorBarVisibility();
                });
            }
            const form = document.getElementById('visitor-seat-form');
            const modelSelect = document.getElementById('visitor-model');
            const nameInput = document.getElementById('visitor-name');
            const knownVisitorNames = new Set(
                modelSelect
                    ? Array.from(modelSelect.options).map((opt) => opt.getAttribute('data-name') || '')
                    : []
            );
            function suggestVisitorName() {
                if (!modelSelect || !nameInput) return;
                const picked = modelSelect.selectedOptions[0];
                const suggested = (picked && picked.getAttribute('data-name')) || '';
                const current = (nameInput.value || '').trim();
                if (!current || knownVisitorNames.has(current)) {
                    nameInput.value = suggested;
                }
            }
            if (modelSelect) {
                suggestVisitorName();
                modelSelect.addEventListener('change', suggestVisitorName);
            }
            const askBtn = document.getElementById('visitor-ask');
            const resetBtn = document.getElementById('visitor-reset');
            const endBtn = document.getElementById('visitor-end');
            if (form) {
                form.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const name = (document.getElementById('visitor-name').value || '').trim();
                    const model = (document.getElementById('visitor-model').value || '').trim();
                    const web = Boolean(document.getElementById('visitor-web').checked);
                    try {
                        await visitorAction('/v1/group-chat/visitor', {
                            body: { display_name: name, model: model, web: web },
                        });
                    } catch (err) {
                        houseStatusEl.textContent = err.message || 'Could not seat visitor';
                    }
                });
            }
            if (askBtn) {
                askBtn.addEventListener('click', async () => {
                    try {
                        await visitorAction('/v1/group-chat/visitor/queue');
                    } catch (err) {
                        houseStatusEl.textContent = err.message || 'Could not ask visitor';
                    }
                });
            }
            if (resetBtn) {
                resetBtn.addEventListener('click', async () => {
                    if (!window.confirm('Reset this visitor? They keep the seat and slug, but lose the conversation.')) {
                        return;
                    }
                    try {
                        await visitorAction('/v1/group-chat/visitor/reset');
                    } catch (err) {
                        houseStatusEl.textContent = err.message || 'Could not reset visitor';
                    }
                });
            }
            if (endBtn) {
                endBtn.addEventListener('click', async () => {
                    if (!window.confirm('End this visitor? They leave the room and the conversation is gone.')) {
                        return;
                    }
                    try {
                        await visitorAction('/v1/group-chat/visitor', { method: 'DELETE' });
                    } catch (err) {
                        houseStatusEl.textContent = err.message || 'Could not end visitor';
                    }
                });
            }
        })();
        init();
    </script>

            border: 1px solid var(--border-subtle);

        }

        .forum-input {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-areas:
                "join input"

            align-items: end;

            grid-area: input;
            min-width: 0;
        }
        .forum-input .prompt-image-preview {
            grid-area: preview;
            margin-top: 0;
        }
        .forum-input .chat-input-toolbar {
            grid-area: toolbar;
        }
        #house-status {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
        }
        @media (max-width: 640px) {
            .forum-input {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "join"
                    "input"
                    "preview"
                    "toolbar";
            }
            .forum-join-btn { width: 100%; }
            .forum-queue-bar {
                font-size: 0.82rem;
                padding: 6px 12px;
            }
            #house-status .house-guest-manage {
                display: none;
            }
        }
    </style>
</body>
