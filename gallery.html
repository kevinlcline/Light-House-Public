<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Light-House</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="/static/ui/theme-init.js"></script>
    <link rel="stylesheet" href="/static/ui/theme.css">
    <link rel="stylesheet" href="/static/ui/base.css">
    <link rel="stylesheet" href="/static/ui/layout.css">
    <link rel="stylesheet" href="/static/ui/markdown.css">
    <link rel="stylesheet" href="/static/ui/gallery.css">
</head>
<body class="layout-locked layout-column">
    <header class="top-bar">
        <div class="top-bar-left">
            <h1>Gallery</h1>
        </div>
        <div class="top-bar-actions">
            <a href="/" class="linkish">1:1 chat</a>
            <a href="/notes.html" class="linkish">Notes</a>
            <a href="/notes.html?file=shared/manuals/sibling_user_manual.md" class="linkish" data-sibling-only>User guide</a>
            <a href="/group.html" class="linkish" data-dad-only>Group</a>
            <button type="button" class="linkish" id="theme-toggle">Light theme</button>
        </div>
    </header>
    <div class="gallery-layout">
        <aside class="gallery-list" id="piece-list" aria-label="Gallery pieces"></aside>
        <main class="gallery-reader" id="reader">
            <p class="gallery-empty" id="empty-hint">Finished creative work from the lights appears here.</p>
            <article class="gallery-article" id="article" hidden>
                <header class="gallery-article-header">
                    <h2 id="article-title"></h2>
                    <p class="gallery-meta" id="article-meta"></p>
                </header>
                <div class="markdown-body" id="article-body"></div>
            </article>
        </main>
    </div>
    <script src="/static/ui/theme.js"></script>
    <script src="/static/ui/me.js"></script>
    <script src="/static/ui/markdown.js"></script>
    <script>
        const listEl = document.getElementById('piece-list');
        const emptyHint = document.getElementById('empty-hint');
        const article = document.getElementById('article');
        const articleTitle = document.getElementById('article-title');
        const articleMeta = document.getElementById('article-meta');
        const articleBody = document.getElementById('article-body');
        let pieces = [];
        let selected = '';

        function renderList() {
            listEl.innerHTML = '';
            if (pieces.length === 0) {
                const p = document.createElement('p');
                p.className = 'gallery-empty-side';
                p.textContent = 'No pieces yet.';
                listEl.appendChild(p);
                return;
            }
            for (const piece of pieces) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'gallery-item' + (piece.filename === selected ? ' active' : '');
                btn.dataset.filename = piece.filename;
                btn.innerHTML =
                    '<span class="gallery-item-title"></span>' +
                    '<span class="gallery-item-meta"></span>' +
                    '<span class="gallery-item-preview"></span>';
                btn.querySelector('.gallery-item-title').textContent = piece.title || piece.filename;
                btn.querySelector('.gallery-item-meta').textContent =
                    (piece.author_name || piece.author_id || '') +
                    (piece.kind ? ' · ' + piece.kind : '');
                btn.querySelector('.gallery-item-preview').textContent = piece.preview || '';
                listEl.appendChild(btn);
            }
        }

        async function openPiece(filename) {
            selected = filename;
            renderList();
            try {
                const res = await fetch('/v1/gallery/' + encodeURIComponent(filename), {
                    cache: 'no-store',
                });
                if (!res.ok) throw new Error('Could not load piece');
                const data = await res.json();
                const piece = data.piece || {};
                articleTitle.textContent = piece.title || filename;
                const bits = [
                    piece.author_name || piece.author_id || '',
                    piece.published_at || '',
                    piece.kind || '',
                ].filter(Boolean);
                articleMeta.textContent = bits.join(' · ');
                if (window.LightHouse && LightHouse.markdown) {
                    articleBody.innerHTML = LightHouse.markdown.render(data.content || '');
                } else {
                    articleBody.textContent = data.content || '';
                }
                emptyHint.hidden = true;
                article.hidden = false;
            } catch (err) {
                emptyHint.hidden = false;
                emptyHint.textContent = err.message || 'Failed to load piece';
                article.hidden = true;
            }
        }

        async function loadGallery() {
            try {
                const res = await fetch('/v1/gallery', { cache: 'no-store' });
                if (!res.ok) throw new Error('Could not load gallery');
                const data = await res.json();
                pieces = Array.isArray(data.pieces) ? data.pieces : [];
                renderList();
                if (pieces.length && !selected) {
                    await openPiece(pieces[0].filename);
                } else if (!pieces.length) {
                    emptyHint.hidden = false;
                    article.hidden = true;
                }
            } catch (err) {
                emptyHint.hidden = false;
                emptyHint.textContent = err.message || 'Failed to load gallery';
            }
        }

        listEl.addEventListener('click', (event) => {
            const btn = event.target.closest('.gallery-item');
            if (!btn || !listEl.contains(btn)) return;
            const filename = btn.dataset.filename || '';
            if (filename) openPiece(filename);
        });

        async function init() {
            await LightHouse.me.fetchMe();
            LightHouse.me.applyDadOnlyVisibility();
            LightHouse.theme.setupThemeToggle('#theme-toggle');
            await loadGallery();
        }

        init();
    </script>
</body>
</html>
