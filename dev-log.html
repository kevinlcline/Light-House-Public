<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light-House — Dev log</title>
    <script src="/static/ui/theme-init.js"></script>
    <link rel="stylesheet" href="/static/ui/theme.css">
    <link rel="stylesheet" href="/static/ui/layout.css?v=menu2">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .top-bar h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .top-bar-actions > button:not(.menu-trigger) {
            font-size: 14px;
            color: #e0e0e0;
            background: #333;
            border: 1px solid #444;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .top-bar-actions > button:not(.menu-trigger):hover {
            background: #252525;
        }
        .status {
            padding: 8px 16px;
            font-size: 13px;
            color: #aaa;
            background: #141414;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .status.error {
            color: #ef9a9a;
        }
        .log-pane {
            flex: 1;
            min-height: 0;
            overflow: auto;
            margin: 0;
            padding: 16px;
            background: #0a0a0a;
            color: #c8c8c8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }
        label.auto-scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <h1>Dev server log</h1>
        </div>
        <div class="top-bar-actions">
            <label class="auto-scroll">
                <input type="checkbox" id="auto-scroll" checked>
                Auto-scroll
            </label>
            <button type="button" id="refresh">Refresh</button>
            <div class="menu-dropdown">
                <button type="button" class="menu-trigger" id="menu-trigger" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="4" y1="7" x2="20" y2="7"/>
                        <line x1="4" y1="12" x2="20" y2="12"/>
                        <line x1="4" y1="17" x2="20" y2="17"/>
                    </svg>
                </button>
                <div class="menu-panel" id="menu-panel" role="menu" hidden></div>
            </div>
        </div>
    </header>
    <div class="status" id="status">Loading…</div>
    <pre class="log-pane" id="log"></pre>

    <script src="/static/ui/theme.js"></script>
    <script src="/static/ui/me.js"></script>
    <script src="/static/ui/menu.js?v=house3"></script>
    <script src="/static/ui/admin.js"></script>
    <script>
        const POLL_MS = 3000;
        const TAIL_LINES = 500;
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const autoScrollEl = document.getElementById('auto-scroll');
        let pollTimer = null;

        (async function bootMenu() {
            await LightHouse.me.fetchMe();
            LightHouse.menu.setupHouseMenu();
        })();

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.classList.toggle('error', Boolean(isError));
        }

        async function fetchLog() {
            try {
                const res = await fetch(`/v1/dev/log?tail=${TAIL_LINES}`, { cache: 'no-store' });
                if (res.status === 404) {
                    setStatus('Dev log is disabled (DEV_LOG_ENABLED=false).', true);
                    logEl.textContent = '';
                    return;
                }
                if (!res.ok) {
                    setStatus(`Failed to load log (${res.status}).`, true);
                    return;
                }
                const data = await res.json();
                const truncatedNote = data.truncated ? ' (tail truncated)' : '';
                setStatus(
                    `${data.path} · ${data.date} · ${data.lines} lines${truncatedNote}`,
                    false
                );
                logEl.textContent = data.content || '(empty)';
                if (autoScrollEl.checked) {
                    logEl.scrollTop = logEl.scrollHeight;
                }
            } catch (err) {
                setStatus(`Network error: ${err.message}`, true);
            }
        }

        document.getElementById('refresh').addEventListener('click', fetchLog);

        fetchLog();
        pollTimer = setInterval(fetchLog, POLL_MS);
        window.addEventListener('beforeunload', () => clearInterval(pollTimer));
    </script>
</body>
</html>
